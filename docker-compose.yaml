version: '3.8'

services:
  db:
    image : mysql:8.0
    container_name: mysql-bigbang
    environment : 
      MYSQL_ROOT_PASSWORD: 1234
    ports :
      - "3308:3306"
    volumes:
      - data:/var/lib/mysql
  backend:
    build : 
      context : ./backend
      dockerfile : Dockerfile
    container_name : fastapi-bigbang
    ports:
      - "8000:8000"
    depends_on :
      - db

  frontend:
    build : 
      context : ./frontend
      dockerfile : Dockerfile
    container_name: react-bigbang
    ports:
      - "3000:3000"
    depends_on :
      - backend
  
volumes:
    data:
  